<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>R DESIGNS</title>
  
  <!-- PWA Manifest link for PWABuilder -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2b2b2b">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #fdfbf7;
      font-family: sans-serif;
    }

    /* Full-screen iframe container for Canva */
    #canva-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Blocking mask overlay at the bottom-right corner to cleanly cover any lingering floating badges */
    .badge-blocker {
      position: fixed;
      bottom: 0;
      right: 0;
      width: 160px;
      height: 50px;
      background-color: transparent; /* Change to match your page background color if needed (e.g. #fdfbf7) */
      z-index: 9999;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Embedded Canva Site -->
  <iframe id="canva-frame" src="https://neonlabs.my.canva.site/3d-printing" title="R DESIGNS"></iframe>
  
  <!-- Corner Shield to hide floating elements -->
  <div class="badge-blocker"></div>

  <script>
    // Register Service Worker for PWA functionality
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/pwabuilder-sw.js')
          .then(reg => console.log('SW registered:', reg))
          .catch(err => console.log('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
