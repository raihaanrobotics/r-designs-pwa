<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>R DESIGNS</title>
  
  <!-- PWA Manifest link for PWABuilder -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2b2b2b">

  <style>
    /* Hides the floating Canva watermark badge */
    iframe[src*="canva"], div[class*="canva-badge"], a[href*="canva.com/design"] {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }
  </style>
</head>
<body style="background-color: #fdfbf7; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif;">
  <div style="text-align: center;">
    <p style="color: #666; margin-bottom: 20px;">Loading R DESIGNS...</p>
    <a href="https://neonlabs.my.canva.site/3d-printing" id="launch-link" style="color: #000; text-decoration: underline;">Click here if not redirected automatically</a>
  </div>

  <script>
    // Register Service Worker first
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/pwabuilder-sw.js')
          .then(reg => console.log('SW registered:', reg))
          .catch(err => console.log('SW registration failed:', err));
      });
    }

    // Redirect human visitors to Canva after a brief moment so crawlers can read the header first
    setTimeout(() => {
      window.location.replace("https://neonlabs.my.canva.site/3d-printing");
    }, 800);
  </script>
</body>
</html>
