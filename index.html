<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>R DESIGNS</title>
  
  <!-- Link to your PWA manifest -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2b2b2b">

  <!-- Instant redirect to your Canva site while keeping PWA wrapper active -->
  <meta http-equiv="refresh" content="0; url=https://neonlabs.my.canva.site/3d-printing">
</head>
<body style="background-color: #fdfbf7; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif;">
  <p style="color: #666;">Loading R DESIGNS...</p>

  <!-- Registers your Service Worker for PWABuilder -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/pwabuilder-sw.js')
          .then(reg => console.log('SW registered:', reg))
          .catch(err => console.log('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
